minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
# mkdist and unbuild declare conservative peer ranges. The library builds and works with the versions
# used here (TypeScript 6, vue-sfc-transformer 0.3), and there is no newer mkdist or unbuild release
# that accepts them yet.
peerDependencyRules:
  allowedVersions:
    mkdist>vue-sfc-transformer: ^0.3.0
    unbuild>typescript: ^6.0.0

shellEmulator: true

overrides:
  '@primeuix/styled': 0.7.4
  '@primeuix/styles': 2.0.3
  '@primeuix/themes': 2.0.3
  '@primeuix/utils': 0.6.4
  '@primevue/core': 4.5.5
  '@primevue/icons': 4.5.5
  primeicons: 7.0.0
  primevue: 4.5.5

allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  json-editor-vue: false
  vue-demi: false
